<!doctype html>
<html lang="es" data-tema="claro">
<head>
<meta charset="utf-8">
<title>Ronda · prueba</title>
<!-- Prueba del diseño nuevo. Datos de ejemplo o vuestra casa (con un código que se pega en el móvil). -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- A1: el degradado tiene que llegar hasta arriba. «black-translucent» es lo único que deja pintar debajo de la hora
     (theme-color y el fondo de html no funcionaron en la app de hoy). El iPhone pone la hora en blanco con este modo. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ronda prueba">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="preload" href="fonts/inter-500.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="fonts/inter-600.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="fonts/inter-display-600.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="ronda.css">
<script>
/* Tema antes de pintar nada, para que no haya un fogonazo al abrir */
try{var t=localStorage.getItem('rondaP-tema')||'auto';var o=t==='oscuro'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.tema=o?'oscuro':'claro';}catch(e){}
/* 0.3.1: la primera vez va la animación larga, que empieza sin la palabra */
try{if(!localStorage.getItem('rondaP-bienvenida'))document.documentElement.classList.add('rn-primera');}catch(e){}
</script>
</head>
<body>
<div id="app"></div>
<div id="capa"></div>
<!-- 0.3.5: la animación empieza desde el fondo vacío, como la de siempre (los archivos salen del móvil: no hay espera). -->
<div id="arranque"></div>
<noscript>Ronda necesita JavaScript.</noscript>
<script src="app.js"></script>
</body>
</html>
